<!DOCTYPE html>
<html lang="en" data-hover-style="bg-ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Animation Test</title>
  <style>
    :root {
      --brand-accent: #c9a84c;
      --brand-radius: 8px;
      --hover-speed: 0.3s;
    }
    
    body {
      background: #0d1f1a;
      padding: 50px;
      font-family: sans-serif;
    }
    
    .menu-card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      cursor: pointer;
      background: #122219;
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 12px;
      padding: 20px;
      color: white;
      width: 300px;
      margin: 20px;
      transition:
        transform var(--hover-speed, 0.3s) cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow var(--hover-speed, 0.3s) ease,
        border-color var(--hover-speed, 0.3s) ease;
    }
    
    .menu-card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      transition:
        transform var(--hover-speed, 0.3s) cubic-bezier(0.4, 0, 0.2, 1),
        opacity var(--hover-speed, 0.3s) ease;
    }
    
    .menu-card > * {
      position: relative;
      z-index: 1;
    }
    
    /* BG LEFT→RIGHT */
    :root[data-hover-style="bg-ltr"] .menu-card::before {
      background: linear-gradient(90deg,
        rgba(201, 168, 76, 0.22) 0%,
        rgba(201, 168, 76, 0.08) 100%);
      transform: translateX(-102%);
      opacity: 1;
    }
    
    :root[data-hover-style="bg-ltr"] .menu-card:hover::before {
      transform: translateX(0);
    }
    
    :root[data-hover-style="bg-ltr"] .menu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px -6px rgba(0,0,0,0.4);
      border-color: rgba(201, 168, 76, 0.5) !important;
    }
    
    button {
      margin: 10px;
      padding: 10px 20px;
      background: #c9a84c;
      border: none;
      border-radius: 6px;
      color: #0d1f1a;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 style="color: white;">Hover Animation Test</h1>
  
  <div>
    <button onclick="document.documentElement.setAttribute('data-hover-style', 'bg-ltr')">BG Left→Right</button>
    <button onclick="document.documentElement.setAttribute('data-hover-style', 'lift')">Lift</button>
  </div>
  
  <div class="menu-card">
    <h3>Test Menu Item</h3>
    <p>Hover over this card to see the animation</p>
    <p style="color: #c9a84c;">Price: 150 ETB</p>
  </div>
  
  <div class="menu-card">
    <h3>Another Item</h3>
    <p>This should also animate</p>
    <p style="color: #c9a84c;">Price: 200 ETB</p>
  </div>
</body>
</html>
